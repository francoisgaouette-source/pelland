<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fanion Game</title>
<meta name="theme-color" content="#14231b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fanion Game">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<script>
/* Sur ordinateur : l'app s'affiche dans un cadre de la taille d'un iPhone, pour avoir exactement la même vue. */
(function () {
  if (window.top !== window || window.innerWidth < 700 || /[?&]plein=1/.test(location.search)) return;
  window.PELLAND_FRAMED = true;
  var q = location.search ? location.search + '&cadre=1' : '?cadre=1';
  document.addEventListener('DOMContentLoaded', function () {
    document.body.innerHTML = '<div class="phone-frame"><iframe src="' + location.pathname + q + location.hash + '" title="Fanion Game"></iframe></div>';
    document.body.className = 'framed';
  });
})();
</script>
<style>
body.framed { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0e1813; }
.phone-frame { width: 402px; height: min(874px, calc(100vh - 32px)); border-radius: 44px; padding: 12px; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.phone-frame iframe { width: 100%; height: 100%; border: 0; border-radius: 34px; background: #fff; display: block; }
</style>
<link rel="stylesheet" href="styles.css?v=20261031f">
</head>
<body>
<header class="bar">
  <button class="bar-back" id="back" hidden aria-label="Retour">‹</button>
  <div class="bar-title" id="barTitle">Fanion Game</div>
  <div class="bar-badge" id="dbBadge"></div>
</header>
<main id="view"></main>

<section class="dock" id="dock" hidden>
  <div class="dock-lines">
    <div class="heard" id="heard">Appuyez sur le micro et parlez.</div>
    <div class="reply" id="reply"></div>
  </div>
  <form class="dock-row" id="typeForm" autocomplete="off">
    <button type="button" class="wake" id="wakeBtn" aria-pressed="false" title="Écoute continue du mot « Pelland »">
      <span class="wake-dot"></span><span>Pelland</span>
    </button>
    <input id="typeInput" type="text" placeholder="Ou écrivez / dictez ici" enterkeyhint="send">
    <button type="button" class="mic" id="micBtn" aria-label="Parler">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H8.5a1 1 0 1 0 0 2h7a1 1 0 1 0 0-2H13v-2.59A6 6 0 0 0 18 11.5Z"/></svg>
    </button>
  </form>
</section>

<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<!-- Firebase (base de données partagée). Sans configuration, l'app fonctionne en mode local sur ce téléphone. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=20261029e"></script>
<script src="logic.js?v=20261031f"></script>
<script src="terrains-qc.js?v=20261029f"></script>
<script src="app.js?v=20261031f"></script>
<script>if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
